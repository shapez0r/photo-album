<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fbf6f2">
  <title>photoalbum — little moments</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Sign in / sign up -->
  <main id="auth-view" class="auth" hidden>
    <div class="auth-card">
      <img class="auth-art" src="landing.svg" alt="" width="240" height="150">
      <div class="brand brand-lg"><span>photoalbum</span></div>
      <p class="muted" data-i18n="auth.tagline">A quiet place for your little moments.</p>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" class="tab active" aria-selected="true" data-i18n="auth.signIn">Sign in</button>
        <button type="button" role="tab" id="tab-signup" class="tab" aria-selected="false" data-i18n="auth.createAccount">Create account</button>
      </div>
      <form id="auth-form" novalidate>
        <label id="name-field" hidden><span data-i18n="auth.displayName">Your name</span>
          <input name="display_name" autocomplete="nickname" maxlength="100">
        </label>
        <label><span data-i18n="auth.email">E-mail</span>
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label><span data-i18n="auth.password">Password</span>
          <input name="password" id="auth-password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" minlength="8" maxlength="72" required>
        </label>
        <label id="confirm-field" hidden><span data-i18n="auth.repeatPassword">Repeat password</span>
          <input name="password_confirm" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" minlength="8" maxlength="72" disabled>
        </label>
        <p id="auth-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn primary wide" id="auth-submit" data-i18n="auth.signIn">Sign in</button>
      </form>
      <p id="signup-disabled" class="muted small" hidden data-i18n="auth.signupDisabled">Account creation is disabled.</p>
    </div>
  </main>

  <!-- Album -->
  <div id="app-view" class="app" hidden>
    <header class="topbar">
      <div class="brand"><img src="favicon.svg" alt="" width="30" height="30"><span>photoalbum</span></div>
      <div class="top-actions">
        <button type="button" class="btn ghost" id="live-open"><span class="dot" aria-hidden="true"></span><span data-i18n="top.live">Live</span></button>
        <button type="button" class="icon-btn" id="settings-toggle" aria-expanded="false" aria-controls="settings" data-i18n-attr="aria-label:top.settings;title:top.settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
        <div class="popover" id="settings" hidden>
          <label><span data-i18n="set.theme">Theme</span><select id="theme-select"></select></label>
          <label><span data-i18n="set.language">Language</span><select id="lang-select"></select></label>
          <p class="muted small" id="storage"></p>
          <button type="button" class="btn ghost wide" id="logout" data-i18n="set.signOut">Sign out</button>
        </div>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow" id="today"></p>
      <h1 id="hello"></h1>
      <p class="muted" id="count"></p>
      <p class="muted small" id="model" hidden></p>
      <div class="hero-actions">
        <button type="button" class="btn primary" id="take"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 4h6l1.5 2H20a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span data-i18n="album.take">Take a photo</span></button>
        <button type="button" class="btn soft" id="upload" data-i18n="album.upload">Choose from gallery</button>
        <input type="file" id="file-capture" accept="image/*" capture="environment" hidden>
        <input type="file" id="file-pick" accept="image/*" hidden>
      </div>
    </section>

    <main class="board" id="board" aria-live="polite"></main>
    <div class="empty" id="empty" hidden>
      <div class="empty-art" aria-hidden="true"></div>
      <h2 data-i18n="album.emptyTitle">Your album is waiting</h2>
      <p class="muted" data-i18n="album.emptyText"></p>
    </div>
  </div>

  <!-- Camera / preview -->
  <dialog id="camera" class="sheet">
    <div class="sheet-head">
      <h2 data-i18n="cam.title">New moment</h2>
      <button type="button" class="icon-btn" data-close data-i18n-attr="aria-label:common.close">✕</button>
    </div>
    <div class="frame">
      <video id="cam-video" playsinline muted autoplay></video>
      <img id="cam-preview" alt="" hidden>
    </div>
    <div class="cam-live">
      <button type="button" class="icon-btn" id="cam-flip" data-i18n-attr="aria-label:cam.flip;title:cam.flip">⟲</button>
      <button type="button" class="shutter" id="cam-shutter" data-i18n-attr="aria-label:cam.shutter"></button>
      <span class="spacer"></span>
    </div>
    <form class="cam-confirm" id="cam-confirm" hidden>
      <input id="cam-caption" maxlength="500" data-i18n-attr="placeholder:cam.caption" autocomplete="off">
      <div class="row">
        <button type="button" class="btn ghost" id="cam-retake" data-i18n="cam.retake">Retake</button>
        <button type="submit" class="btn primary" id="cam-add" data-i18n="cam.add">Add to album</button>
      </div>
    </form>
  </dialog>

  <!-- Single photo -->
  <dialog id="viewer" class="sheet viewer">
    <div class="sheet-head">
      <p class="muted small" id="viewer-date"></p>
      <button type="button" class="icon-btn" data-close data-i18n-attr="aria-label:common.close">✕</button>
    </div>
    <img id="viewer-img" alt="">
    <form id="viewer-form">
      <input id="viewer-caption" maxlength="500" data-i18n-attr="placeholder:cam.caption" autocomplete="off">
      <div class="row">
        <button type="button" class="btn ghost danger" id="viewer-delete" data-i18n="view.delete">Delete</button>
        <button type="submit" class="btn primary" data-i18n="view.save">Save caption</button>
      </div>
    </form>
  </dialog>

  <!-- Live slideshow -->
  <div id="live" class="live" hidden>
    <div class="live-stage" id="live-stage"></div>
    <div class="live-caption"><p id="live-text"></p><p class="small" id="live-date"></p></div>
    <button type="button" class="icon-btn live-close" id="live-close" data-i18n-attr="aria-label:common.close">✕</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
