# Single node: one container, SQLite on a volume, in-process cache.
# Perfect for a laptop or home-lab PC.   docker compose up -d --build
name: photoalbum
services:
  photoalbum:
    build: .
    image: photoalbum:latest
    restart: unless-stopped
    ports:
      - "${PHOTOALBUM_PORT:-8092}:8092"
    environment:
      PHOTOALBUM_ALLOW_SIGNUP: "${PHOTOALBUM_ALLOW_SIGNUP:-true}"
      PHOTOALBUM_SIGNUP_CIDRS: "${PHOTOALBUM_SIGNUP_CIDRS:-}"
      PHOTOALBUM_COOKIE_SECURE: "${PHOTOALBUM_COOKIE_SECURE:-false}"
      PHOTOALBUM_SESSION_TTL: "${PHOTOALBUM_SESSION_TTL:-720h}"
      PHOTOALBUM_MAX_FILE_MB: "${PHOTOALBUM_MAX_FILE_MB:-15}"
      PHOTOALBUM_QUOTA_MB: "${PHOTOALBUM_QUOTA_MB:-2048}"
      PHOTOALBUM_MODEL: "${PHOTOALBUM_MODEL:-Claude Sonnet 5.5 by Anthropic}"
    volumes:
      - photoalbum-data:/data

volumes:
  photoalbum-data:
