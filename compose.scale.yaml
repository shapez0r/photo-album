# Scaled-out stack: N stateless app replicas behind nginx, MariaDB as the
# shared database (sessions and photos) and Valkey as the shared cache.
#   docker compose -f compose.scale.yaml up -d --build
#   docker compose -f compose.scale.yaml up -d --scale photoalbum=5   (then: docker compose -f compose.scale.yaml restart lb)
name: photoalbum-scale
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    # Photos are stored as LONGBLOBs: allow packets larger than the biggest file.
    command: ["--max-allowed-packet=256M"]
    environment:
      MARIADB_DATABASE: photoalbum
      MARIADB_USER: photoalbum
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-change-me}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-change-me-too}"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  photoalbum:
    build: .
    image: photoalbum:latest
    restart: unless-stopped
    deploy:
      replicas: 3
    environment:
      PHOTOALBUM_DB_DRIVER: mariadb
      PHOTOALBUM_DB_DSN: "photoalbum:${MARIADB_PASSWORD:-change-me}@tcp(mariadb:3306)/photoalbum?charset=utf8mb4"
      PHOTOALBUM_CACHE_URL: redis://valkey:6379/0
      PHOTOALBUM_PROXY_HEADER: X-Forwarded-For
      PHOTOALBUM_ALLOW_SIGNUP: "${PHOTOALBUM_ALLOW_SIGNUP:-true}"
      PHOTOALBUM_SIGNUP_CIDRS: "${PHOTOALBUM_SIGNUP_CIDRS:-}"
      PHOTOALBUM_COOKIE_SECURE: "${PHOTOALBUM_COOKIE_SECURE:-false}"
      PHOTOALBUM_MAX_FILE_MB: "${PHOTOALBUM_MAX_FILE_MB:-15}"
      PHOTOALBUM_QUOTA_MB: "${PHOTOALBUM_QUOTA_MB:-2048}"
      PHOTOALBUM_MODEL: "${PHOTOALBUM_MODEL:-Claude Sonnet 5.5}"
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PHOTOALBUM_PORT:-8092}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      photoalbum:
        condition: service_healthy

volumes:
  mariadb-data:
